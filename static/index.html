<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Botnest Server</title><style>body{margin:0;background:#0b0c12;color:#eee;font:14px system-ui}main{max-width:1000px;margin:auto;padding:32px 18px}h1{letter-spacing:-1px}.muted{color:#8b8f9e}.top{display:flex;justify-content:space-between;align-items:center}.btn{padding:10px 13px;border:1px solid #ffffff1c;border-radius:8px;background:#9b91ff;color:#17142c;font-weight:700;cursor:pointer}.btn.secondary{background:#ffffff0b;color:#ddd}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.card{border:1px solid #ffffff12;border-radius:14px;padding:18px;background:#151721}.bot{padding:13px 0;border-bottom:1px solid #ffffff10;display:flex;align-items:center;gap:12px}.bot:last-child{border:0}.botmain{flex:1}.status{font-size:11px;padding:4px 7px;border-radius:5px}.online{color:#5cdbb1;background:#51d5aa18}.offline{color:#aaa;background:#fff1}.error{color:#ff8791;background:#f2778418}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{padding:7px 8px;border:1px solid #ffffff15;border-radius:6px;background:#ffffff08;color:#ddd;cursor:pointer}.logs{height:330px;overflow:auto;background:#090a0f;border-radius:9px;padding:10px;font:11px monospace}.log{padding:6px 0;border-bottom:1px solid #ffffff0b}.success{color:#5cdbb1}.warn{color:#f1c55d}.errorlog{color:#ff7f8c}.info{color:#a7bfff}.modal{position:fixed;inset:0;display:grid;place-items:center;background:#000b}.modal>div{width:min(430px,calc(100% - 36px));padding:24px;border:1px solid #9b91ff44;border-radius:15px;background:#1b1e2a}.field{display:block;margin:13px 0;color:#aeb1bf;font-size:12px}.field input{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:11px;border:1px solid #ffffff18;border-radius:7px;background:#0e1017;color:#fff}.hide{display:none}.summary{margin:10px 0;padding:10px;border-radius:8px;background:#ffffff06;color:#aaa;font:11px monospace}.cmd{display:inline-block;margin:3px;padding:4px 6px;border-radius:5px;background:#51d5aa18;color:#70dfb8} @media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px;flex-direction:column}}</style></head><body><main><div class="top"><div><h1>Botnest <span style="color:#9b91ff">Server</span></h1><p class="muted">Backend real para hospedar bots Python e Node.js</p></div><button class="btn" onclick="openModal()">＋ Adicionar bot</button></div><div class="grid"><section class="card"><h2>Hospedagens</h2><div id="bots"><p class="muted">Carregando...</p></div></section><aside class="card"><h2>Logs em tempo real</h2><div id="selected" class="muted">Selecione um bot.</div><div id="logs" class="logs"></div></aside></div></main><div id="modal" class="modal hide"><div><h2>Enviar projeto</h2><p class="muted">Envie ZIP com bot.py/main.py ou bot.js/index.js. O servidor detecta runtime, User, ID e comandos.</p><label class="field">Nome do bot<input id="name" placeholder="meu-bot"></label><label class="field">Arquivo ZIP<input id="file" type="file" accept=".zip,application/zip"></label><div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="upload()">Enviar e analisar</button></div></div></div><script>let bots=[],selected=null;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function openModal(){$('modal').classList.remove('hide')}function closeModal(){$('modal').classList.add('hide')}async function api(url,opt){let r=await fetch(url,opt),d=await r.json();if(!r.ok)throw Error(d.error||'Erro');return d}async function refresh(){bots=await api('/api/bots');$('bots').innerHTML=bots.length?bots.map(b=>`<div class="bot"><div class="botmain"><b>${esc(b.name)}</b> <span class="status ${b.status}">${esc(b.status)}</span><div class="muted">${esc(b.runtime)} · ${esc(b.file)}</div><div class="summary">User: ${esc(b.analysis.user)}<br>ID: ${esc(b.analysis.botId)}<br>Commands: ${b.analysis.commands.length||0}</div></div><div class="actions"><button class="mini" onclick="action(${b.id},'start')">▶</button><button class="mini" onclick="action(${b.id},'restart')">↻</button><button class="mini" onclick="action(${b.id},'stop')">Ⅱ</button><button class="mini" onclick="showLogs(${b.id})">Logs</button><button class="mini" onclick="removeBot(${b.id})">Excluir</button></div></div>`).join(''):'<p class="muted">Nenhum bot enviado.</p>';if(selected)showLogs(selected)}async function upload(){let f=$('file').files[0];if(!f)return alert('Escolha um ZIP.');let fd=new FormData();fd.append('file',f);fd.append('name',$('name').value);try{await api('/api/bots',{method:'POST',body:fd});closeModal();$('file').value='';refresh()}catch(e){alert(e.message)}}async function action(id,a){try{await api('/api/bots/'+id+'/'+a,{method:'POST'});selected=id;await refresh()}catch(e){alert(e.message)}}async function removeBot(id){if(confirm('Excluir este bot?')){await api('/api/bots/'+id,{method:'DELETE'});if(selected===id)selected=null;refresh()}}async function showLogs(id){selected=id;let b=bots.find(x=>x.id===id);$('selected').innerHTML=`<b>${esc(b.name)}</b><br><span class="muted">User: ${esc(b.analysis.user)} · ID: ${esc(b.analysis.botId)} · ${esc(b.runtime)}</span><p>${(b.analysis.commands||[]).map(c=>`<span class="cmd">${esc(c)}</span>`).join('')||'Nenhum comando encontrado'}</p>`;let logs=await api('/api/bots/'+id+'/logs');$('logs').innerHTML=logs.map(l=>`<div class="log ${l.level}">[${new Date(l.time*1000).toLocaleTimeString()}] ${esc(l.message)}</div>`).join('');}refresh();setInterval(()=>selected&&showLogs(selected),2500)</script></body></html>
